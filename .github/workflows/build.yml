name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexiera-backend
    env:
      # Prisma config requires a URL during client generation; build does not connect to it.
      DATABASE_URL: mysql://build:build@127.0.0.1:3306/build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nexiera-backend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexiera-frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api-staging.example.com/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nexiera-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
